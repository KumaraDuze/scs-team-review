paths:
  uploads: uploads
  uploads_use_relative_path: false
  static: ''
collections_config:
  scs_v8_one_editor_visual_editing_setup:
    path: SCS_V8_One_Editor_Visual_Editing_Setup
    icon: phonelink_setup
    disable_url: false
    include_developer_files: false
    _inputs:
      $.source:
        cascade: true
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
timezone: America/Belize
markdown:
  engine: commonmark
  options:
    xhtml: false
    breaks: false
    linkify: false
    typographer: false
    spaced_lists: false
    sentence_per_line: false
    gfm: false
    code_block_fences: '```'
    escape_snippets_in_code_blocks: false
    treat_indentation_as_code: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    attributes: false
